version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  open-pull-requests-limit: 20
  groups:
    minori-e-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: C:/Program Files/Git/ci-standard/esempio
  schedule:
    interval: daily
  open-pull-requests-limit: 20
  groups:
    minori-e-patch:
      update-types:
      - minor
      - patch
