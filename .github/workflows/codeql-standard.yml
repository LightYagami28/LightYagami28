---
# CodeQL riusabile. Separato dal CI standard perché richiede security-events: write:
# il job chiamante deve concederlo esplicitamente.
name: CodeQL standard

"on":
  workflow_call:
    inputs:
      languages:
        description: Linguaggi CodeQL separati da virgola (es. javascript-typescript,python)
        type: string
        default: javascript-typescript
      build-mode:
        type: string
        default: none

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ inputs.languages }}
          build-mode: ${{ inputs.build-mode }}
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
