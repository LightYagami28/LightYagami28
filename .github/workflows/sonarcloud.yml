---
name: SonarCloud

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN_CONFIGURED: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test con copertura del progetto di esempio
        working-directory: ci-standard/esempio
        run: |
          npm run coverage
          sed -i 's#^SF:#SF:ci-standard/esempio/#' lcov.info
      # Il segreto SONAR_TOKEN manca nelle PR da fork (e in quelle di Dependabot): l'analisi si salta.
      - name: SonarCloud scan
        if: env.SONAR_TOKEN_CONFIGURED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
